[project]
name = "xagent"
version = "0.2.0"
description = "Interactive AI coding agent with a terminal TUI"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "platformdirs",
    "textual",
]

[project.optional-dependencies]
image = ["pillow"]

[project.scripts]
xagent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.data" = ["models.json"]
"src.prompts" = ["*.md"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "0.3.0"
description = "Interactive AI coding agent with a terminal TUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "xagent contributors" }]
keywords = ["ai", "agent", "coding", "terminal", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "openai",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "platformdirs",
    "textual",
    "requests>=2.34.2",
]

[project.optional-dependencies]
image = ["pillow"]

[project.scripts]
xagent = "src.main:main"

[project.urls]
Homepage = "https://github.com/xp266/xagent"
Repository = "https://github.com/xp266/xagent"
Issues = "https://github.com/xp266/xagent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.md"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lingcode"
version = "0.2.0"
description = "Interactive AI agent for software engineering tasks"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "openai",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
]

[project.optional-dependencies]
image = ["pillow"]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

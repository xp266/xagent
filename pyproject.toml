[project]
name = "xagent"
version = "0.2.0"
description = "Interactive AI agent for software engineering tasks"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "textual",
]

[project.optional-dependencies]
image = ["pillow"]

[dependency-groups]
dev = []

[project.scripts]
xagent = "main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
